<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cards Admin</title>
  <style>
    :root{
      --bg:#0b0c10; --panel:#121318; --muted:#9aa3af; --text:#e7eaf0; --accent:#5eead4; --danger:#fca5a5; --warn:#fde68a;
      --border:#232633; --ok:#86efac;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0b0c10,#0f1117);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    .container{max-width:1000px;margin:0 auto;padding:24px}
    h1{font-size:28px;margin:0 0 6px}
    p.caption{margin:0 0 16px;color:var(--muted)}

    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgb(0 0 0 / 25%)}

    /* Add form */
    form#addForm{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;padding:16px}
    form#addForm input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#0d0f14;color:var(--text)}
    form#addForm button{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:#0d0f14;color:var(--text);cursor:pointer}
    form#addForm button:hover{outline:1px solid var(--accent)}

    /* Toolbar */
    .toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border)}
    .search{display:flex;gap:10px;align-items:center}
    .search input{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#0d0f14;color:var(--text)}
    .refresh{border:1px solid var(--border);background:#0d0f14;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
    .refresh:hover{outline:1px solid var(--accent)}

    /* Table */
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:separate;border-spacing:0 8px;padding:16px}
    thead th{font-weight:600;color:var(--muted);text-align:left;padding:6px 10px}
    tbody tr{background:#0d0f14;border:1px solid var(--border)}
    tbody td{padding:10px}
    tbody tr td:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
    tbody tr td:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}

    .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--border)}
    .badge.on{background:rgb(134 239 172 / .08);border-color:rgb(134 239 172 / .3)}
    .badge.off{background:rgb(252 165 165 / .08);border-color:rgb(252 165 165 / .3)}

    /* Buttons */
    .btn{font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#0f1218;color:var(--text)}
    .btn:hover{outline:1px solid var(--accent)}
    .btn.warn{background:rgb(253 230 138 / .1)}
    .btn.danger{background:rgb(252 165 165 / .1)}

    .row-actions{display:flex;gap:8px}

    .error{margin-top:12px;color:#ef9a9a}
    .hidden{display:none}

    /* Responsive */
    @media (max-width: 720px){
      form#addForm{grid-template-columns:1fr;}
      thead{display:none}
      tbody tr{display:grid;grid-template-columns:1fr;gap:6px;padding:8px}
      tbody td{display:flex;justify-content:space-between;align-items:center;padding:6px 8px}
      tbody td .label{color:var(--muted);margin-right:12px}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Card Manager</h1>
    <p class="caption">
      <a href="/logs.html" style="color: var(--accent); margin-left:8px">View Access Logs →</a>
    </p>
    <!-- Add new card -->
    <div class="panel">
      <form id="addForm" autocomplete="off">
        <input id="uid" name="uid" placeholder="UID (e.g. A1B2C3D4)" required />
        <input id="cardholderName" name="cardholderName" placeholder="Cardholder Name" required />
        <button type="submit">Add Card</button>
      </form>
      <div class="toolbar">
        <div class="search">
          <input id="q" placeholder="Filter by Cardholder Name or UID" />
        </div>
        <button class="refresh" id="refreshBtn">Refresh</button>
      </div>

      <div class="table-wrap">
        <table id="cardsTable" aria-live="polite">
          <thead>
            <tr>
              <th style="width:22%">UID</th>
              <th style="width:28%">Cardholder Name</th>
              <th style="width:14%">Status</th>
              <th style="width:36%">Actions</th>
            </tr>
          </thead>
          <tbody id="cardsBody"></tbody>
        </table>
      </div>
    </div>

    <div id="error" class="error hidden" role="status" aria-live="assertive"></div>
  </div>

<script>
  // ===== Configure your API here =====
  const API_BASE = '/api/cards';
  // This UI expects your backend to expose:
  //   GET    /api/cards           -> { cards: [...] }  (or raw array)
  //   POST   /api/cards           -> { card: {...} }   (or flat object)
  //   PATCH  /api/cards/:id       -> update partial fields
  //   DELETE /api/cards/:id       -> delete
  // Card shape: {_id, uid, cardholderName, active}

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const els = {
    body: $('#cardsBody'),
    error: $('#error'),
    q: $('#q'),
    addForm: $('#addForm'),
    uid: $('#uid'),
    cardholderName: $('#cardholderName'),
    refreshBtn: $('#refreshBtn'),
  };

  let CARDS = [];

  function setError(msg){
    if(!msg){ els.error.classList.add('hidden'); els.error.textContent=''; return; }
    els.error.textContent = msg; els.error.classList.remove('hidden');
  }

  async function api(path, opts={}){
    const res = await fetch(API_BASE + path, {
      headers: {'Content-Type':'application/json'},
      cache:'no-store',
      ...opts,
    });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${res.statusText} - ${t}`);
    }
    // Try json, fallback to text
    try { return await res.json(); } catch { return await res.text(); }
  }

  async function load(){
    setError('');
    try{
      const data = await api('', { method:'GET' });
      const arr = Array.isArray(data)
        ? data
        : Array.isArray(data?.cards)
          ? data.cards
          : Array.isArray(data?.tasks) // legacy fallback
            ? data.tasks
            : [];
      CARDS = (arr || []).map(x => ({
        _id: x._id ?? x.id ?? x.uid,
        uid: x.uid ?? '',
        cardholderName: x.cardholderName ?? x.name ?? '',
        active: !!x.active
      }));
      render();
    }catch(e){ setError(e.message || 'Failed to load'); }
  }

  function render(){
    const q = (els.q.value || '').toLowerCase().trim();
    const filtered = CARDS
      .slice()
      .sort((a,b)=> (b.active - a.active) || (a.cardholderName||'').localeCompare(b.cardholderName||''))
      .filter(c => !q || (c.uid?.toLowerCase().includes(q) || c.cardholderName?.toLowerCase().includes(q)));

    els.body.innerHTML = '';
    for(const c of filtered){ els.body.appendChild(renderRow(c)); }
    if(filtered.length === 0){
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 4;
      td.style.color = 'var(--muted)';
      td.textContent = 'No cards found.';
      tr.appendChild(td); els.body.appendChild(tr);
    }
  }

  function renderRow(card){
    const tr = document.createElement('tr');
    tr.dataset.id = card._id;

    const tdUid = document.createElement('td');
    const tdName = document.createElement('td');
    const tdStatus = document.createElement('td');
    const tdActions = document.createElement('td');

    // UID
    tdUid.innerHTML = `<span>${escapeHtml(card.uid)}</span>`;

    // Name
    tdName.innerHTML = `<span>${escapeHtml(card.cardholderName)}</span>`;

    // Status badge
    const badge = document.createElement('span');
    badge.className = `badge ${card.active ? 'on' : 'off'}`;
    badge.innerHTML = card.active ? `
      <span style="width:8px;height:8px;border-radius:999px;background:var(--ok);display:inline-block"></span>
      Active` : `
      <span style="width:8px;height:8px;border-radius:999px;background:var(--danger);display:inline-block"></span>
      Inactive`;
    tdStatus.appendChild(badge);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'row-actions';

    const editBtn = makeBtn('Edit', () => enterEdit(tr, card));
    const toggleBtn = makeBtn(card.active ? 'Deactivate' : 'Activate', () => toggleActive(card));
    toggleBtn.classList.add('warn');

    const delBtn = makeBtn('Delete', () => del(card));
    delBtn.classList.add('danger');

    actions.append(editBtn, toggleBtn, delBtn);
    tdActions.appendChild(actions);

    tr.append(tdUid, tdName, tdStatus, tdActions);
    return tr;
  }

  function makeBtn(label, onClick){
    const b = document.createElement('button');
    b.className = 'btn'; b.type='button'; b.textContent = label; b.addEventListener('click', onClick); return b;
  }

  function enterEdit(tr, card){
    const { _id } = card;
    tr.innerHTML = '';

    const tdUid = document.createElement('td');
    const tdName = document.createElement('td');
    const tdStatus = document.createElement('td');
    const tdActions = document.createElement('td');

    const uidInput = document.createElement('input'); uidInput.value = card.uid; styleEdit(uidInput);
    const nameInput = document.createElement('input'); nameInput.value = card.cardholderName; styleEdit(nameInput);

    tdUid.appendChild(uidInput);
    tdName.appendChild(nameInput);
    tdStatus.appendChild(document.createTextNode(card.active ? 'Active' : 'Inactive'));

    const save = makeBtn('Save', async () => {
      try{
        setError('');
        await api('/' + encodeURIComponent(_id), {
          method:'PATCH', body: JSON.stringify({ uid: uidInput.value.trim(), cardholderName: nameInput.value.trim() })
        });
        const idx = CARDS.findIndex(x => x._id === _id);
        if(idx>-1){ CARDS[idx].uid = uidInput.value.trim(); CARDS[idx].cardholderName = nameInput.value.trim(); }
        render();
      }catch(e){ setError(e.message || 'Failed to save'); }
    });

    const cancel = makeBtn('Cancel', () => render());

    tdActions.appendChild(wrapActions([save, cancel]));
    tr.append(tdUid, tdName, tdStatus, tdActions);
  }

  function styleEdit(input){
    input.style.width = '100%';
    input.style.padding = '8px 10px';
    input.style.border = '1px solid var(--border)';
    input.style.borderRadius = '10px';
    input.style.background = '#0d0f14';
    input.style.color = 'var(--text)';
  }

  function wrapActions(btns){ const div=document.createElement('div'); div.className='row-actions'; btns.forEach(b=>div.appendChild(b)); return div; }

  async function toggleActive(card){
    try{
      setError('');
      await api('/' + encodeURIComponent(card._id), { method:'PATCH', body: JSON.stringify({ active: !card.active }) });
      const idx = CARDS.findIndex(x => x._id === card._id);
      if(idx>-1){ CARDS[idx].active = !CARDS[idx].active; }
      render();
    }catch(e){ setError(e.message || 'Failed to update'); }
  }

  async function del(card){
    const ok = confirm(`Delete card\n${card.cardholderName || ''} (${card.uid})?`);
    if(!ok) return;
    try{
      setError('');
      await api('/' + encodeURIComponent(card._id), { method:'DELETE' });
      CARDS = CARDS.filter(x => x._id !== card._id);
      render();
    }catch(e){ setError(e.message || 'Failed to delete'); }
  }

  els.addForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const uid = els.uid.value.trim();
    const cardholderName = els.cardholderName.value.trim();
    if(!uid || !cardholderName){ setError('Please enter both UID and Cardholder Name.'); return; }
    try{
      setError('');
      const created = await api('', { method:'POST', body: JSON.stringify({ uid, cardholderName, active:true }) });
      // Accept either { card: {...} } or a flat object
      const c = created?.card ?? created;
      if(c && (c._id || c.id || c.uid)){
        CARDS.push({
          _id: c._id ?? c.id ?? c.uid,
          uid: c.uid,
          cardholderName: c.cardholderName,
          active: !!c.active
        });
      } else {
        await load();
      }
      els.uid.value=''; els.cardholderName.value='';
      render();
    }catch(e){ setError(e.message || 'Failed to add card'); }
  });

  els.q.addEventListener('input', render);
  els.refreshBtn.addEventListener('click', load);

  function escapeHtml(s){ return (s??'').replace(/[&<>"]+/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  // Initial load
  load();
</script>
</body>
</html>
