<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Logs</title>
  <style>
    :root{
      --bg:#0b0c10; --panel:#121318; --muted:#9aa3af; --text:#e7eaf0; --accent:#5eead4; --danger:#fca5a5; --warn:#fde68a;
      --border:#232633; --ok:#86efac;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0b0c10,#0f1117);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    h1{font-size:28px;margin:0 0 6px}
    p.caption{margin:0 0 16px;color:var(--muted)}

    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgb(0 0 0 / 25%)}

    .toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
    .search{display:flex;gap:10px;align-items:center}
    .search input{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#0d0f14;color:var(--text)}
    .refresh{border:1px solid var(--border);background:#0d0f14;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
    .refresh:hover{outline:1px solid var(--accent)}

    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:separate;border-spacing:0 8px;padding:16px}
    thead th{font-weight:600;color:var(--muted);text-align:left;padding:6px 10px}
    tbody tr{background:#0d0f14;border:1px solid var(--border)}
    tbody td{padding:10px;vertical-align:middle}
    tbody tr td:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
    tbody tr td:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}

    .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--border)}
    .badge.ok{background:rgb(134 239 172 / .08);border-color:rgb(134 239 172 / .3)}
    .badge.fail{background:rgb(252 165 165 / .08);border-color:rgb(252 165 165 / .3)}

    .btn{font:inherit;cursor:pointer;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#0f1218;color:var(--text)}
    .btn:hover{outline:1px solid var(--accent)}
    .btn.primary{background:rgb(94 234 212 / .1)}

    .row-actions{display:flex;gap:8px}

    .error{margin-top:12px;color:#ef9a9a}
    .hidden{display:none}

    @media (max-width: 800px){
      thead{display:none}
      tbody tr{display:grid;grid-template-columns:1fr;gap:6px;padding:8px}
      tbody td{display:flex;justify-content:space-between;align-items:center;padding:6px 8px}
      tbody td .label{color:var(--muted);margin-right:12px}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Access Logs</h1>
    <p class="caption">View access attempts. Register unknown cards directly from a log entry with one click.</p>
    <p class="caption">
      <a href="/index.html" style="color: var(--accent)">← Back to Home</a>
    </p>

    <div class="panel">
      <div class="toolbar">
        <div class="search">
          <input id="q" placeholder="Filter by UID, Name, MAC, IP" />
        </div>
        <div style="display:flex; gap:8px; align-items:center">
          <label style="display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px">
            <input type="checkbox" id="onlyUnregistered" /> Unknown only
          </label>
          <button class="refresh" id="refreshBtn">Refresh</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="logsTable" aria-live="polite">
          <thead>
            <tr>
              <th style="width:16%">When</th>
              <th style="width:10%">UID</th>
              <th style="width:20%">Cardholder</th>
              <th style="width:10%">Granted</th>
              <th style="width:12%">MAC</th>
              <th style="width:12%">IP</th>
              <th style="width:8%">RSSI</th>
              <th style="width:12%">Actions</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
    </div>

    <div id="error" class="error hidden" role="status" aria-live="assertive"></div>
  </div>

<script>
  // ===== API endpoints =====
  const LOGS_API = '/api/logs';  // GET -> {logs:[...]}
  const CARDS_API = '/api/cards'; // GET -> {cards:[...]}, POST -> create card

  const $ = (sel) => document.querySelector(sel);
  const els = {
    body: $('#logsBody'),
    q: $('#q'),
    onlyUnregistered: $('#onlyUnregistered'),
    error: $('#error'),
    refreshBtn: $('#refreshBtn'),
  };

  let LOGS = [];
  // Cache of registered card UIDs (populated from /api/cards)
  let CARD_UIDS = new Set();

  function setError(msg){
    if(!msg){ els.error.classList.add('hidden'); els.error.textContent=''; return; }
    els.error.textContent = msg; els.error.classList.remove('hidden');
  }

  async function api(url, opts={}){
    const res = await fetch(url, { headers: {'Content-Type':'application/json'}, cache:'no-store', ...opts });
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${res.statusText} - ${t}`);
    }
    try { return await res.json(); } catch { return await res.text(); }
  }

  async function load(){
    setError('');
    try{
      // Load logs and cards together
      const [logsRes, cardsRes] = await Promise.all([
        api(LOGS_API, { method:'GET' }),
        api(CARDS_API, { method:'GET' }),
      ]);

      // Logs
      const arr = Array.isArray(logsRes) ? logsRes : (Array.isArray(logsRes?.logs) ? logsRes.logs : []);
      LOGS = (arr || []).map(x => ({
        _id: x._id ?? x.id,
        uid: x.uid ?? '',
        cardholderName: x.cardholderName ?? 'N/A',
        accessGranted: !!x.accessGranted,
        date: x.date ? new Date(x.date) : null,
        mac: x.mac ?? '',
        ip: x.ip ?? '',
        rssi: typeof x.rssi === 'number' ? x.rssi : (x.rssi ? Number(x.rssi) : null),
      }));

      // Cards → set of known UIDs (works with either {cards:[...]} or raw array)
      const cardsArr = Array.isArray(cardsRes)
        ? cardsRes
        : (Array.isArray(cardsRes?.cards) ? cardsRes.cards : []);
      CARD_UIDS = new Set((cardsArr || []).map(c => (c.uid || '').trim()).filter(Boolean));

      render();
    }catch(e){ setError(e.message || 'Failed to load logs'); }
  }

  function render(){
    const q = (els.q.value || '').toLowerCase().trim();
    const onlyUnreg = !!els.onlyUnregistered.checked;

    const filtered = LOGS
      .slice()
      .sort((a,b)=> (b.date?.getTime?.()||0) - (a.date?.getTime?.()||0))
      .filter(l => {
        // If toggled, only show logs where UID is not registered
        const isRegistered = l.uid && CARD_UIDS.has(l.uid);
        if(onlyUnreg && isRegistered) return false;

        if(!q) return true;
        return [l.uid, l.cardholderName, l.mac, l.ip].some(v => (v||'').toLowerCase().includes(q));
      });

    els.body.innerHTML = '';
    if(filtered.length === 0){
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 8; td.style.color = 'var(--muted)'; td.textContent = 'No matching logs.'; tr.appendChild(td);
      els.body.appendChild(tr);
      return;
    }

    for(const log of filtered){ els.body.appendChild(renderRow(log)); }
  }

  function renderRow(log){
    const tr = document.createElement('tr');

    const tdWhen = document.createElement('td');
    const tdUid = document.createElement('td');
    const tdName = document.createElement('td');
    const tdGranted = document.createElement('td');
    const tdMac = document.createElement('td');
    const tdIp = document.createElement('td');
    const tdRssi = document.createElement('td');
    const tdActions = document.createElement('td');

    tdWhen.textContent = log.date ? fmtRel(log.date) : '—';
    tdUid.textContent = log.uid || '—';
    tdName.textContent = log.cardholderName || 'N/A';

    const badge = document.createElement('span');
    badge.className = `badge ${log.accessGranted ? 'ok' : 'fail'}`;
    badge.innerHTML = log.accessGranted
      ? '<span style="width:8px;height:8px;border-radius:999px;background:var(--ok);display:inline-block"></span> Granted'
      : '<span style="width:8px;height:8px;border-radius:999px;background:var(--danger);display:inline-block"></span> Denied';
    tdGranted.appendChild(badge);

    tdMac.textContent = log.mac || '—';
    tdIp.textContent = log.ip || '—';
    tdRssi.textContent = (log.rssi ?? '—');

    const actions = document.createElement('div');
    actions.className = 'row-actions';

    // Show Register button iff UID is NOT registered
    const isRegistered = log.uid && CARD_UIDS.has(log.uid);
    if (!isRegistered && log.uid) {
      const regBtn = makeBtn('Register', async () => {
        try{
          const cardholderName = (prompt(`Enter cardholder name for UID ${log.uid}`) || '').trim();
          if(!cardholderName) return; // cancelled or empty
          setError('');
          await api(CARDS_API, { method:'POST', body: JSON.stringify({ uid: log.uid, cardholderName, active: true }) });
          // Immediately mark as registered so the button disappears without a reload
          CARD_UIDS.add(log.uid);
          render();
        }catch(e){ setError(e.message || 'Failed to register card'); }
      });
      regBtn.classList.add('primary');
      actions.appendChild(regBtn);
    }

    tdActions.appendChild(actions);

    tr.append(tdWhen, tdUid, tdName, tdGranted, tdMac, tdIp, tdRssi, tdActions);
    return tr;
  }

  function makeBtn(label, onClick){ const b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent=label; b.addEventListener('click', onClick); return b; }

  function fmtRel(d){
    try{
      const now = new Date();
      const diff = Math.max(0, now - d);
      const sec = Math.floor(diff/1000);
      const min = Math.floor(sec/60);
      const hrs = Math.floor(min/60);
      const days = Math.floor(hrs/24);
      if(sec < 60) return `${sec}s ago`;
      if(min < 60) return `${min}m ago`;
      if(hrs < 24) return `${hrs}h ago`;
      return d.toLocaleString();
    }catch{ return d?.toString?.() || '—'; }
  }

  els.q.addEventListener('input', render);
  els.onlyUnregistered.addEventListener('change', render);
  els.refreshBtn.addEventListener('click', load);

  // Initial load
  load();
</script>
</body>
</html>
